# Render(https://render.com) 블루프린트: 저장소를 연결하면 아래 설정으로 웹 서비스가 생성됩니다.
services:
  - type: web
    name: muvslike
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
